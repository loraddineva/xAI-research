run_id: test_run_eval
generation_run_id: test_run_eval
created_at: '2026-05-16T07:43:27.025272+00:00'
config:
  run:
    name: pilot_run
    seed: 42
  datasets:
  - name: adult
    path: data/processed/adult.csv
    shap_col_prefix: shap_
    n_instances: 100
    task_description: predict whether a person's annual income exceeds $50,000, based
      on demographic and employment data
    positive_class_label: income above $50,000
    negative_class_label: income at or below $50,000
  - name: german_credit
    path: data/processed/german_credit.csv
    shap_col_prefix: shap_
    n_instances: 100
    task_description: predict whether a loan applicant is a good credit risk, based
      on financial and personal data
    positive_class_label: good credit risk
    negative_class_label: bad credit risk
  models:
  - id: claude-opus
    provider: anthropic
    model_name: claude-opus-4-6
    max_tokens: 512
    temperature: 0.0
    base_url: null
  - id: llama3-70b
    provider: together
    model_name: meta-llama/Llama-3-70b-chat-hf
    max_tokens: 512
    temperature: 0.0
    base_url: null
  - id: mistral-7b
    provider: mistral
    model_name: mistral-small-latest
    max_tokens: 512
    temperature: 0.0
    base_url: null
  prompt:
    strategies:
    - id: martens
      template: config/prompts/narrative.j2
      max_tokens: null
    - id: chain_of_thought
      template: config/prompts/chain_of_thought.j2
      max_tokens: 1024
  storage:
    generation_dir: outputs/generation/
  visualisation:
    figure_dir: outputs/figures/
    format: png
    dpi: 150
  evaluation:
    extraction_model_id: claude-opus
    template: config/prompts/extract.j2
    top_k_features: 3
    export_dir: outputs/evaluations/
extraction_model_id: claude-opus
n_records: 1
n_failed: 0
n_any_hallucination: 1
