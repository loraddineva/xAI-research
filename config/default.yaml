run:
  name: "pilot_run"
  seed: 42

datasets:
  - name: "adult"
    path: "data/processed/adult.csv"
    shap_col_prefix: "shap_"
    n_instances: 100
    task_description: "predict whether a person's annual income exceeds $50,000, based on demographic and employment data"
    positive_class_label: "income above $50,000"
    negative_class_label: "income at or below $50,000"

models:
  - id: "claude-opus"
    provider: "anthropic"
    model_name: "claude-opus-4-6"
    max_tokens: 512
    temperature: 0.0
  - id: "llama3-70b"
    provider: "together"
    model_name: "meta-llama/Llama-3-70b-chat-hf"
    max_tokens: 512
    temperature: 0.0
  - id: "mistral-7b"
    provider: "mistral"
    model_name: "mistral-small-latest"
    max_tokens: 512
    temperature: 0.0
  # Local model (uncomment when local deployment is set up)
  # - id: "llama3-local"
  #   provider: "ollama"
  #   model_name: "llama3:70b"
  #   base_url: "http://localhost:11434"

prompt:
  strategies:
    - id: martens
      template: "config/prompts/narrative.j2"
    - id: chain_of_thought
      template: "config/prompts/chain_of_thought.j2"
      max_tokens: 1024

storage:
  generation_dir: "outputs/generation/"

evaluation:
  extraction_model_id: "claude-opus"
  template: "config/prompts/extract.j2"
  top_k_features: 3
  export_dir: "outputs/evaluations/"
  robustness:
    n_runs: 5
    temperature: 0.9
    min_successful_runs: 3
    reliability_threshold: 0.8
    subsample_fraction: 1.0   # use 0.1 for a 10% calibration subsample
    max_workers: 5

visualisation:
  figure_dir: "outputs/figures/"
  format: "png"
  dpi: 150
